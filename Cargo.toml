[package]
name = "youtube-corpus"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio-rustls",
  "postgres",
  "chrono",
  "uuid",
  "json",
  "migrate",
  "macros",
] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "process", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.11", features = ["v5", "serde"] }

text-core = { package = "moritzbrantner-text-core", path = "../rust-packages/crates/text/text-core" }
text-embeddings = { package = "moritzbrantner-text-embeddings", path = "../rust-packages/crates/text/text-embeddings" }
text-lexical = { package = "moritzbrantner-text-lexical", path = "../rust-packages/crates/text/text-lexical" }
text-transcripts = { package = "moritzbrantner-text-transcripts", path = "../rust-packages/crates/text/text-transcripts" }

[dev-dependencies]
tempfile = "3.23"
