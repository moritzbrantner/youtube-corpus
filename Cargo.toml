[package]
name = "youtube-corpus"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Local CLI and browser UI for building a searchable YouTube transcript corpus in Postgres."
readme = "README.md"
repository = "https://github.com/moritzbrantner/youtube-corpus"
homepage = "https://github.com/moritzbrantner/youtube-corpus"
rust-version = "1.95"

[dependencies]
anyhow = "1.0"
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
mime_guess = "2.0.5"
open = "5.3.5"
regex = "1.13"
rust-embed = "8.11.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
shlex = "2.0.1"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring-webpki",
  "postgres",
  "chrono",
  "uuid",
  "json",
  "migrate",
  "macros",
] }
thiserror = "2.0"
tokio = { version = "1.48", features = [
  "macros",
  "rt-multi-thread",
  "process",
  "fs",
  "time",
  "sync",
] }
tower-http = { version = "0.7.0", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5.8"
uuid = { version = "1.11", features = ["v4", "v5", "serde"] }

text-core = { package = "moenarch-text-core", git = "https://github.com/moritzbrantner/nlp-stack", rev = "22174b23fe30678a41491d71c510337e056d7615" }
text-embeddings = { package = "moenarch-text-embeddings", git = "https://github.com/moritzbrantner/nlp-stack", rev = "22174b23fe30678a41491d71c510337e056d7615" }
text-lexical = { package = "moenarch-text-lexical", git = "https://github.com/moritzbrantner/nlp-stack", rev = "22174b23fe30678a41491d71c510337e056d7615" }
text-linguistics = { package = "moenarch-text-linguistics", git = "https://github.com/moritzbrantner/nlp-stack", rev = "22174b23fe30678a41491d71c510337e056d7615", features = [
  "candle",
  "model-bundles",
] }
model-runtime = { package = "moenarch-model-runtime", git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "cf8d6f1052ad1d5c567e797a56d3bb8910828920" }
text-transcripts = { package = "moenarch-text-transcripts", git = "https://github.com/moritzbrantner/nlp-stack", rev = "22174b23fe30678a41491d71c510337e056d7615" }
media-core = { package = "moenarch-media-core", git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "cf8d6f1052ad1d5c567e797a56d3bb8910828920" }
corpus-core = { package = "moenarch-corpus-core", git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "cf8d6f1052ad1d5c567e797a56d3bb8910828920" }
runtime-core = { package = "moenarch-runtime-core", git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "cf8d6f1052ad1d5c567e797a56d3bb8910828920" }
video-analysis-ffmpeg = { package = "moenarch-video-analysis-ffmpeg", git = "https://github.com/moritzbrantner/visual-analysis", rev = "35a53204cea66e7f438b962afe23b6cef1de0004" }
video-analysis-ingest = { package = "moenarch-video-analysis-ingest", git = "https://github.com/moritzbrantner/visual-analysis", rev = "35a53204cea66e7f438b962afe23b6cef1de0004" }
video-analysis-core = { package = "moenarch-video-analysis-core", git = "https://github.com/moritzbrantner/visual-analysis", rev = "35a53204cea66e7f438b962afe23b6cef1de0004" }
image-analysis-core = { package = "moenarch-image-analysis-core", git = "https://github.com/moritzbrantner/visual-analysis", rev = "35a53204cea66e7f438b962afe23b6cef1de0004" }
image-analysis-detection = { package = "moenarch-image-analysis-detection", git = "https://github.com/moritzbrantner/visual-analysis", rev = "35a53204cea66e7f438b962afe23b6cef1de0004", features = [
  "onnx",
] }
image-analysis-embeddings = { package = "moenarch-image-analysis-embeddings", git = "https://github.com/moritzbrantner/visual-analysis", rev = "35a53204cea66e7f438b962afe23b6cef1de0004", features = [
  "onnx",
] }
runtime-onnx = { package = "moenarch-runtime-onnx", git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "cf8d6f1052ad1d5c567e797a56d3bb8910828920", features = [
  "onnxruntime",
] }
vector-analysis-core = { package = "moenarch-vector-analysis-core", git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "cf8d6f1052ad1d5c567e797a56d3bb8910828920" }

audio-analysis-speakers = { package = "moenarch-audio-analysis-speakers", git = "https://github.com/moritzbrantner/audio-analysis", rev = "d7c78028a1e84d0ebde8f6a93a19c4565534b0bc", features = [
  "onnx",
  "model-bundles",
] }
audio-analysis-core = { package = "moenarch-audio-analysis-core", git = "https://github.com/moritzbrantner/audio-analysis", rev = "d7c78028a1e84d0ebde8f6a93a19c4565534b0bc" }
audio-analysis-io = { package = "moenarch-audio-analysis-io", git = "https://github.com/moritzbrantner/audio-analysis", rev = "d7c78028a1e84d0ebde8f6a93a19c4565534b0bc" }
audio-analysis-processing = { package = "moenarch-audio-analysis-processing", git = "https://github.com/moritzbrantner/audio-analysis", rev = "d7c78028a1e84d0ebde8f6a93a19c4565534b0bc" }

# Default ASR through one reused `TranscriptionSession` (#73), plus the translation
# planner/executor and native OPUS-MT provider (#69, native-whisperx #373).
native-whisperx = { git = "https://github.com/moritzbrantner/native-whisperx", rev = "3b9a5a6be8472144aba8d49f018fef0f67bdddb0", default-features = false, features = [
  "native",
  "media-decode",
  "translation",
] }

# Opt-in Tantivy lexical search pilot (#76); Postgres stays the default provider.
search-engine = { git = "https://github.com/moritzbrantner/search-engine", rev = "3bde04c958fb2bba19e9e75584793518999bfb33" }

audio-contracts = { package = "moenarch-audio-contracts", git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "cf8d6f1052ad1d5c567e797a56d3bb8910828920" }

[features]
# Default ASR on CUDA when a GPU is present (building needs the CUDA toolkit). Without it, or
# when a GPU run fails, ASR runs on the CPU (#73).
cuda = ["native-whisperx/cuda"]

[dev-dependencies]
tempfile = "=3.27.0"
tower = { version = "=0.5.3", features = ["util"] }

# Owner decision #40 (option B): capability crates come from exact public git revisions. The
# pinned nlp-stack and visual-analysis revisions declare registry requirements on foundation (and
# visual-analysis on text-core); these patches resolve them to the same exact revisions, so the
# graph holds one copy of each crate. The foundation rev is c2c1ab1 (foundation main with the
# media-core rolling-caption projection, foundation#138 for #92); the foundation crate versions
# that nlp-stack 22174b2 and visual-analysis 35a5320 require resolve there. Visual OCR supports
# the pinned byte-span API.
# Current set: foundation c2c1ab1, nlp-stack 22174b2 (temporal normalizer nlp-stack#156, multilingual NER #167, per-sentence language routing #171, NER weights loaded once #173),
# visual-analysis 35a5320 (OCR span compatibility; see visual-analysis #87).
[patch.crates-io]
moenarch-math-signal-core = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "cf8d6f1052ad1d5c567e797a56d3bb8910828920" }
moenarch-audio-contracts = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "cf8d6f1052ad1d5c567e797a56d3bb8910828920" }
moenarch-data-inversion-core = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "cf8d6f1052ad1d5c567e797a56d3bb8910828920" }
moenarch-math-geometry-2d = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "cf8d6f1052ad1d5c567e797a56d3bb8910828920" }
moenarch-math-linear = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "cf8d6f1052ad1d5c567e797a56d3bb8910828920" }
moenarch-math-sparse-data = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "cf8d6f1052ad1d5c567e797a56d3bb8910828920" }
moenarch-media-core = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "cf8d6f1052ad1d5c567e797a56d3bb8910828920" }
moenarch-model-runtime = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "cf8d6f1052ad1d5c567e797a56d3bb8910828920" }
moenarch-numbers-core = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "cf8d6f1052ad1d5c567e797a56d3bb8910828920" }
moenarch-runtime-core = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "cf8d6f1052ad1d5c567e797a56d3bb8910828920" }
moenarch-runtime-onnx = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "cf8d6f1052ad1d5c567e797a56d3bb8910828920" }
moenarch-tensor-data = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "cf8d6f1052ad1d5c567e797a56d3bb8910828920" }
moenarch-vector-analysis-core = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "cf8d6f1052ad1d5c567e797a56d3bb8910828920" }
moenarch-vector-analysis-index = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "cf8d6f1052ad1d5c567e797a56d3bb8910828920" }
moenarch-text-core = { git = "https://github.com/moritzbrantner/nlp-stack", rev = "22174b23fe30678a41491d71c510337e056d7615" }
# native-whisperx (#69) declares registry requirements on audio-analysis, nlp-stack and
# visual-analysis crates; resolve them to the revisions pinned above so the graph keeps one copy.
# native-whisperx needs audio-analysis APIs newer than the published releases. audio-analysis
# d7c7802 is native-whisperx's pin: VAD chunk-stub repair (native-whisperx#417), faster-whisper
# temperature fallback (#419) and per-stage device diagnostics (#422).
moenarch-audio-analysis-speakers = { git = "https://github.com/moritzbrantner/audio-analysis", rev = "d7c78028a1e84d0ebde8f6a93a19c4565534b0bc" }
moenarch-audio-analysis-transcription = { git = "https://github.com/moritzbrantner/audio-analysis", rev = "d7c78028a1e84d0ebde8f6a93a19c4565534b0bc" }
moenarch-audio-analysis-io = { git = "https://github.com/moritzbrantner/audio-analysis", rev = "d7c78028a1e84d0ebde8f6a93a19c4565534b0bc" }
moenarch-text-transcripts = { git = "https://github.com/moritzbrantner/nlp-stack", rev = "22174b23fe30678a41491d71c510337e056d7615" }
moenarch-video-analysis-core = { git = "https://github.com/moritzbrantner/visual-analysis", rev = "35a53204cea66e7f438b962afe23b6cef1de0004" }
# Foundation c2c1ab1 depends on the registry name `search-kernels` and resolves it to this exact
# rust-kernels revision through its own workspace patch; mirror that patch here.
search-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "51ef7878165b83db0d10ad7420fee6b4aba97099" }

[build-dependencies]
sha2 = "0.11"
