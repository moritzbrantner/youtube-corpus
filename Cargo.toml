[package]
name = "youtube-corpus"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Local CLI and browser UI for building a searchable YouTube transcript corpus in Postgres."
readme = "README.md"
repository = "https://github.com/moritzbrantner/youtube-corpus"
homepage = "https://github.com/moritzbrantner/youtube-corpus"
rust-version = "1.95"

[dependencies]
anyhow = "1.0"
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
mime_guess = "2.0.5"
open = "5.3.5"
rust-embed = "8.11.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shlex = "2.0.1"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio-rustls",
  "postgres",
  "chrono",
  "uuid",
  "json",
  "migrate",
  "macros",
] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "process", "fs", "time"] }
tower-http = { version = "0.7.0", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5.8"
uuid = { version = "1.11", features = ["v4", "v5", "serde"] }

text-core = { package = "moenarch-text-core", git = "https://github.com/moritzbrantner/nlp-stack", rev = "057689ca1df031d677f4afd9d65eed181c6fca06" }
text-embeddings = { package = "moenarch-text-embeddings", git = "https://github.com/moritzbrantner/nlp-stack", rev = "057689ca1df031d677f4afd9d65eed181c6fca06" }
text-lexical = { package = "moenarch-text-lexical", git = "https://github.com/moritzbrantner/nlp-stack", rev = "1fc6b19c651eef98257d51c946852f2ade121aeb" }
text-transcripts = { package = "moenarch-text-transcripts", git = "https://github.com/moritzbrantner/nlp-stack", rev = "057689ca1df031d677f4afd9d65eed181c6fca06" }
runtime-core = { package = "moenarch-runtime-core", git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "648e3ef18dc5d32d5fcbb211ed7a118b2731a387" }
video-analysis-ffmpeg = { package = "moenarch-video-analysis-ffmpeg", git = "https://github.com/moritzbrantner/visual-analysis", rev = "8852f257de6ddc4580698ad00d4c9a9ab8461b70" }
video-analysis-ingest = { package = "moenarch-video-analysis-ingest", git = "https://github.com/moritzbrantner/visual-analysis", rev = "8852f257de6ddc4580698ad00d4c9a9ab8461b70" }

[dev-dependencies]
tempfile = "3.23"
tower = { version = "0.5.3", features = ["util"] }

# Owner decision #40 (option B): capability crates come from exact public git revisions. The
# pinned nlp-stack and visual-analysis revisions declare registry requirements on foundation (and
# visual-analysis on text-core); these patches resolve them to the same exact revisions, so the
# graph holds one copy of each crate. Keep the foundation rev aligned with the foundation revision
# those repositories declare (648e3ef for nlp-stack 057689c / visual-analysis 8852f25).
[patch.crates-io]
moenarch-audio-contracts = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "648e3ef18dc5d32d5fcbb211ed7a118b2731a387" }
moenarch-jobs-core = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "648e3ef18dc5d32d5fcbb211ed7a118b2731a387" }
moenarch-math-geometry-2d = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "648e3ef18dc5d32d5fcbb211ed7a118b2731a387" }
moenarch-math-linear = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "648e3ef18dc5d32d5fcbb211ed7a118b2731a387" }
moenarch-math-sparse-data = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "648e3ef18dc5d32d5fcbb211ed7a118b2731a387" }
moenarch-media-core = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "648e3ef18dc5d32d5fcbb211ed7a118b2731a387" }
moenarch-numbers-core = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "648e3ef18dc5d32d5fcbb211ed7a118b2731a387" }
moenarch-runtime-core = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "648e3ef18dc5d32d5fcbb211ed7a118b2731a387" }
moenarch-runtime-onnx = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "648e3ef18dc5d32d5fcbb211ed7a118b2731a387" }
moenarch-tensor-data = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "648e3ef18dc5d32d5fcbb211ed7a118b2731a387" }
moenarch-vector-analysis-core = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "648e3ef18dc5d32d5fcbb211ed7a118b2731a387" }
moenarch-vector-analysis-index = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "648e3ef18dc5d32d5fcbb211ed7a118b2731a387" }
moenarch-text-core = { git = "https://github.com/moritzbrantner/nlp-stack", rev = "057689ca1df031d677f4afd9d65eed181c6fca06" }
