[package]
name = "youtube-corpus"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Local CLI and browser UI for building a searchable YouTube transcript corpus in Postgres."
readme = "README.md"
repository = "https://github.com/moritzbrantner/youtube-corpus"
homepage = "https://github.com/moritzbrantner/youtube-corpus"
rust-version = "1.95"

[dependencies]
anyhow = "1.0"
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
mime_guess = "2.0.5"
open = "5.3.5"
rust-embed = "8.11.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "2.0.1"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio-rustls",
  "postgres",
  "chrono",
  "uuid",
  "json",
  "migrate",
  "macros",
] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "process", "fs", "time"] }
tower-http = "0.6.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5.8"
uuid = { version = "1.11", features = ["v4", "v5", "serde"] }

text-core = { package = "moritzbrantner-text-core", path = "../rust-packages/crates/text/text-core" }
text-embeddings = { package = "moritzbrantner-text-embeddings", path = "../rust-packages/crates/text/text-embeddings" }
text-lexical = { package = "moritzbrantner-text-lexical", path = "../rust-packages/crates/text/text-lexical" }
text-transcripts = { package = "moritzbrantner-text-transcripts", path = "../rust-packages/crates/text/text-transcripts" }
runtime-core = { package = "moritzbrantner-runtime-core", path = "../rust-packages/crates/runtime/runtime-core" }
jobs-core = { package = "moritzbrantner-jobs-core", path = "../rust-packages/crates/jobs/jobs-core" }
video-analysis-ffmpeg = { package = "moritzbrantner-video-analysis-ffmpeg", path = "../rust-packages/crates/video/video-analysis-ffmpeg" }
video-analysis-ingest = { package = "moritzbrantner-video-analysis-ingest", path = "../rust-packages/crates/video/video-analysis-ingest" }

[dev-dependencies]
tempfile = "3.23"
tower = { version = "0.5.3", features = ["util"] }
