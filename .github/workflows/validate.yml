name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web-artifact:
    name: Build or reuse embedded web artifact
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/build-artifact.yml@5291d5162b128faca9dd83edba24e7342730e604
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      artifact_key: youtube-corpus-embedded-web-v1
      bun_version: "1.3.14"
      rust_toolchain: "1.98.1"
      rust_targets: wasm32-unknown-unknown
      cache_bun: true
      bun_cache_dependency_path: bun.lock
      cache_cargo: true
      cargo_cache_dependency_path: Cargo.lock
      use_environment_v1: false
      setup_command: |
        bun install --frozen-lockfile
        bash scripts/install-wasm-pack-ci.sh
      build_command: bun run build
      artifact_paths: dist
      reuse_across_runs: true
      artifact_retention_days: 7
      timeout_minutes: 30

  repository-validation:
    name: Repository-local validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify pinned binary bootstrap and artifact consumers
        run: python3 -m unittest scripts/test_wasm_pack_ci_bootstrap.py

      - name: Verify exact-revision capability dependencies
        run: |
          jq -e '.schemaVersion == 2 and .cargo.localOnly == true and (.cargo.patches | length == 0)' .coding-tooling.source-deps.json >/dev/null
          python3 scripts/check_capability_pins.py

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check frontend formatting
        run: bun run format:check

      - name: Check browser Wasm formatting
        run: cargo fmt --manifest-path crates/youtube-browser-wasm/Cargo.toml --check

      - name: Test browser extraction core
        run: bun run test:browser-wasm

      - name: Test standalone browser analysis
        run: bun run test:frontend

      - name: Check repository Rust formatting
        run: cargo fmt --check

      - name: Lint Rust server
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test Rust server
        run: cargo test --locked

      - name: Verify unified text search against Postgres
        run: |
          docker compose up -d --wait postgres
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/youtube_corpus \
            cargo test --locked --test unified_evidence_search_db -- --ignored
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/youtube_corpus \
            cargo test --locked --test review_regressions_db -- --ignored
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/youtube_corpus \
            cargo test --locked --test entity_explorer_db -- --ignored
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/youtube_corpus \
            cargo test --locked --test detector_profiles_db -- --ignored

      - name: Shut down test Postgres
        if: always()
        run: docker compose down -v

  artifact-validation:
    name: Embedded web artifact validation
    needs: build-web-artifact
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-web-artifact.outputs.source_sha }}

      - name: Consume verified embedded web artifact
        uses: moritzbrantner/reusable-workflows/.github/actions/consume-build-artifact@5291d5162b128faca9dd83edba24e7342730e604
        with:
          producer_run_id: ${{ needs.build-web-artifact.outputs.producer_run_id }}
          receipt_artifact_name: ${{ needs.build-web-artifact.outputs.receipt_artifact_name }}
          artifact_name: ${{ needs.build-web-artifact.outputs.artifact_name }}
          artifact_digest: ${{ needs.build-web-artifact.outputs.artifact_digest }}
          source_sha: ${{ needs.build-web-artifact.outputs.source_sha }}
          artifact_key: ${{ needs.build-web-artifact.outputs.artifact_key }}
          identity_digest: ${{ needs.build-web-artifact.outputs.identity_digest }}
          destination_path: dist
          github_token: ${{ github.token }}

      - name: Verify embedded web artifact
        run: |
          test -s dist/index.html
          test -s dist/analysis-capabilities.json
          grep -q 'youtube-corpus' dist/index.html
          jq -e '.pagesStandalone == true and .backend.requiredForPages == false and .browser.captionAcquisition.directYoutube == true' dist/analysis-capabilities.json >/dev/null
          find dist -type f -name '*.wasm' -size +0c | grep -q .
