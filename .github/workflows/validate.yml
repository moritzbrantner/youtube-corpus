name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Repository-local validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Format analyzer sources
        run: |
          ./node_modules/.bin/oxfmt --write src/app/features/analyzer/AudioYouTubeAnalyzer.tsx src/app/features/analyzer/audio-browser-analysis.ts

      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/features/analyzer/AudioYouTubeAnalyzer.tsx src/app/features/analyzer/audio-browser-analysis.ts
          if git diff --cached --quiet; then
            echo "No formatter changes needed."
            exit 0
          fi
          git commit -m "Format browser audio analyzer"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
