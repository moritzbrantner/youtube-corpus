name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-validation:
    uses: moritzbrantner/reusable-workflows/.github/workflows/fast-validation.yml@458c85c1a58cac26a5ab978e12ab8e9a27d4e0ee
    permissions:
      contents: read
      packages: read
    with:
      node_version: ""
      bun_version: "1.3.14"
      install_command: bun install --frozen-lockfile
      cache_bun: true
      cache_cargo: true
      cargo_cache_dependency_path: Cargo.lock
      pre_command: |
        set -euo pipefail
        rustup toolchain install stable --profile minimal --component rustfmt
        rustup default stable
      format_command: |
        bun run format:check
        cargo fmt --check
      typecheck_command: |
        bun run build
        cargo check
        cargo clippy --all-targets -- -D warnings
      unit_test_command: cargo test

  integration-validation:
    uses: moritzbrantner/reusable-workflows/.github/workflows/integration-validation.yml@458c85c1a58cac26a5ab978e12ab8e9a27d4e0ee
    permissions:
      contents: read
      packages: read
    with:
      node_version: ""
      bun_version: "1.3.14"
      install_command: bun install --frozen-lockfile
      cache_bun: true
      cache_cargo: true
      cargo_cache_dependency_path: Cargo.lock
      pre_command: |
        set -euo pipefail
        rustup toolchain install stable --profile minimal
        rustup default stable
      integration_command: bun run verify:postgres
      post_command: docker compose down -v

  link-validation:
    uses: moritzbrantner/reusable-workflows/.github/workflows/link-validation.yml@458c85c1a58cac26a5ab978e12ab8e9a27d4e0ee
    permissions:
      contents: read
      packages: read
    with:
      node_version: ""
      bun_version: "1.3.14"
      install_command: bun install --frozen-lockfile
      build_command: bun run build
      start_command: bun run preview -- --host 127.0.0.1 --port 4173
      link_check_url: http://127.0.0.1:4173
      upload_artifacts_on: failure
