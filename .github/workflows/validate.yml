name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Repository-local validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify local-only source contract
        run: |
          jq -e '.schemaVersion == 2 and .cargo.localOnly == true' .coding-tooling.source-deps.json >/dev/null
          jq -e '.cargo.patches | length > 0 and all(.[]; (.package | length > 0) and (.git | length > 0) and (.rev | test("^[0-9a-f]{40}$")) and (.localPath | length > 0))' .coding-tooling.source-deps.json >/dev/null

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Show canonical frontend formatting
        run: |
          bun run format
          echo '<<< AudioYouTubeAnalyzer.tsx'
          cat src/app/features/analyzer/AudioYouTubeAnalyzer.tsx
          echo '>>> AudioYouTubeAnalyzer.tsx'
          echo '<<< audio-browser-analysis.ts'
          cat src/app/features/analyzer/audio-browser-analysis.ts
          echo '>>> audio-browser-analysis.ts'
          exit 1
