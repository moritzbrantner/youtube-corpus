name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Repository-local validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Verify local-only source contract
        run: |
          jq -e '.schemaVersion == 2 and .cargo.localOnly == true' .coding-tooling.source-deps.json >/dev/null
          jq -e '.cargo.patches | length > 0 and all(.[]; (.package | length > 0) and (.git | length > 0) and (.rev | test("^[0-9a-f]{40}$")) and (.localPath | length > 0))' .coding-tooling.source-deps.json >/dev/null

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Install wasm-pack
        run: if ! command -v wasm-pack; then cargo install wasm-pack --version 0.14.0 --locked; fi

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check frontend formatting
        run: bun run format:check

      - name: Check browser Wasm formatting
        run: cargo fmt --manifest-path crates/youtube-browser-wasm/Cargo.toml --check

      - name: Test browser extraction core
        run: bun run test:browser-wasm

      - name: Test standalone browser analysis
        run: bun run test:frontend

      - name: Build frontend
        run: bun run build

      - name: Check repository Rust formatting
        run: cargo fmt --check

      - name: Explain source verification boundary
        run: |
          echo "The standalone browser extractor is repository-owned and fully validated here, including its Rust/Wasm build."
          echo "The larger Rust server graph, clippy, tests, and Postgres integration checks still run in the local coding workspace against the exact sibling source graph."
