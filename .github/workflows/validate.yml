name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Repository-local validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify local-only source contract
        run: |
          jq -e '.schemaVersion == 2 and .cargo.localOnly == true' .coding-tooling.source-deps.json >/dev/null
          jq -e '.cargo.patches | length > 0 and all(.[]; (.package | length > 0) and (.git | length > 0) and (.rev | test("^[0-9a-f]{40}$")) and (.localPath | length > 0))' .coding-tooling.source-deps.json >/dev/null

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check frontend formatting
        run: bun run format:check

      - name: Build frontend
        run: bun run build

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Explain source verification boundary
        run: |
          echo "Repository-local validation is intentionally independent of sibling source availability."
          echo "The source-graph job below separately verifies the exact pinned cross-repository graph."

  source-graph-validation:
    name: Exact source graph
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: youtube_corpus_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d youtube_corpus_verify"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/youtube_corpus_verify
    steps:
      - uses: actions/checkout@v4

      - name: Check out exact sibling sources
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/moritzbrantner/nlp-stack.git ../nlp-stack
          git -C ../nlp-stack checkout 057689ca1df031d677f4afd9d65eed181c6fca06
          git clone --filter=blob:none https://github.com/moritzbrantner/moenarch-foundation.git ../moenarch-foundation
          git -C ../moenarch-foundation checkout b7533cd02269124deece75b76477ca55a853cd77
          git clone --filter=blob:none https://github.com/moritzbrantner/visual-analysis.git ../visual-analysis
          git -C ../visual-analysis checkout a25d3e540d2ed90f1001fe76704ebc11815bc9db

      - name: Activate exact source overrides
        run: |
          set -euo pipefail
          mkdir -p .cargo
          jq -r --arg root "$PWD" '[.cargo.patches[].localPath | ($root + "/" + .)] | "paths = [\n" + (map("  \"" + . + "\"") | join(",\n")) + "\n]"' .coding-tooling.source-deps.json > .cargo/config.toml
          cat .cargo/config.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Verify visual adapters
        run: |
          cargo test --manifest-path ../visual-analysis/Cargo.toml -p moenarch-video-analysis-recognition --features ocr
          cargo test --manifest-path ../visual-analysis/Cargo.toml -p moenarch-video-analysis-ingest

      - name: Verify source graph compiles
        run: cargo check --locked

      - name: Verify source graph tests
        run: cargo test --locked

      - name: Verify source graph lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Verify Postgres contracts
        run: bash scripts/verify-postgres.sh
