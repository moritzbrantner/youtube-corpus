name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Repository-local validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/corpus-workspaces-reprocessing

      - name: Verify local-only source contract
        run: |
          jq -e '.schemaVersion == 2 and .cargo.localOnly == true' .coding-tooling.source-deps.json >/dev/null
          jq -e '.cargo.patches | length > 0 and all(.[]; (.package | length > 0) and (.git | length > 0) and (.rev | test("^[0-9a-f]{40}$")) and (.localPath | length > 0))' .coding-tooling.source-deps.json >/dev/null

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check frontend formatting
        run: bun run format:check

      - name: Build frontend
        run: bun run build

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply Rust formatting
        run: |
          cargo fmt
          if ! git diff --quiet -- '*.rs'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.rs'
            git commit -m "chore: apply rustfmt"
            git push origin HEAD:codex/corpus-workspaces-reprocessing
          fi

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Explain source verification boundary
        run: |
          echo "Rust build, clippy, tests, and Postgres integration checks run in the local coding workspace against the exact sibling source graph."
          echo "Hosted CI stays repository-local; registry-only verification remains a release/distribution concern."
