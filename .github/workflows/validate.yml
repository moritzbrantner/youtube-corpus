name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  fast-validation:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/fast-validation.yml@workflow-standard-v1
    with:
      node_version: ""
      bun_version: "1.3.14"
      install_command: bun install --frozen-lockfile
      cache_bun: true
      cache_cargo: true
      cargo_cache_dependency_path: Cargo.lock
      pre_command: |
        set -euo pipefail
        rustup toolchain install stable --profile minimal --component rustfmt
        rustup default stable
      format_command: |
        bun run format:check
        cargo fmt --check
      typecheck_command: |
        bun run build
        cargo check
      unit_test_command: cargo test

  integration-validation:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/integration-validation.yml@workflow-standard-v1
    with:
      node_version: ""
      bun_version: "1.3.14"
      install_command: bun install --frozen-lockfile
      cache_bun: true
      cache_cargo: true
      cargo_cache_dependency_path: Cargo.lock
      pre_command: |
        set -euo pipefail
        rustup toolchain install stable --profile minimal
        rustup default stable
      integration_command: |
        set -euo pipefail
        docker compose up -d postgres
        timeout 90 bash -c 'until docker compose exec -T postgres pg_isready -U postgres -d youtube_corpus; do sleep 2; done'
        bun run build
        DATABASE_URL=postgres://postgres:postgres@localhost:5432/youtube_corpus cargo test -- --ignored
      post_command: docker compose down -v
