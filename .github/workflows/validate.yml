name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Repository-local validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/retrieval-quality-annotations

      - name: Apply evaluation identity fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/evaluation.rs')
          text = path.read_text()
          old = '            query.to_lowercase()\n'
          new = '            query\n'
          if old not in text:
              raise SystemExit('expected evaluation identity expression not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt
          git diff --check

      - name: Commit evaluation identity fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/evaluation.rs
          git commit -m "Fix evaluation case identity"
          git push origin HEAD:codex/retrieval-quality-annotations
