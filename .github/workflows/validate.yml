name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-validation:
    uses: moritzbrantner/reusable-workflows/.github/workflows/fast-validation.yml@458c85c1a58cac26a5ab978e12ab8e9a27d4e0ee
    permissions:
      contents: read
      packages: read
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
    with:
      node_version: ""
      bun_version: "1.3.14"
      install_command: bun install --frozen-lockfile
      cache_bun: true
      cache_cargo: true
      cargo_cache_dependency_path: Cargo.lock
      pre_command: |
        set -euo pipefail
        auth="$(printf 'x-access-token:%s' "$GH_PACKAGES_TOKEN" | base64 -w0)"
        git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" clone https://github.com/moritzbrantner/nlp-stack.git ../nlp-stack
        git -C ../nlp-stack checkout 057689ca1df031d677f4afd9d65eed181c6fca06
        git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" clone https://github.com/moritzbrantner/moenarch-foundation.git ../moenarch-foundation
        git -C ../moenarch-foundation checkout ead588f27d130d775524db31189b734a224843d5
        git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" clone https://github.com/moritzbrantner/visual-analysis.git ../visual-analysis
        git -C ../visual-analysis checkout d341c668f1baa14cd3d4e99c8ce8f5d39e43a974
        rustup toolchain install stable --profile minimal --component rustfmt
        rustup default stable
      format_command: |
        bun run format:check
        cargo fmt --check
      typecheck_command: |
        bun run build
        cargo check
        cargo clippy --all-targets -- -D warnings
      unit_test_command: cargo test

  integration-validation:
    uses: moritzbrantner/reusable-workflows/.github/workflows/integration-validation.yml@458c85c1a58cac26a5ab978e12ab8e9a27d4e0ee
    permissions:
      contents: read
      packages: read
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
    with:
      node_version: ""
      bun_version: "1.3.14"
      install_command: bun install --frozen-lockfile
      cache_bun: true
      cache_cargo: true
      cargo_cache_dependency_path: Cargo.lock
      pre_command: |
        set -euo pipefail
        auth="$(printf 'x-access-token:%s' "$GH_PACKAGES_TOKEN" | base64 -w0)"
        git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" clone https://github.com/moritzbrantner/nlp-stack.git ../nlp-stack
        git -C ../nlp-stack checkout 057689ca1df031d677f4afd9d65eed181c6fca06
        git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" clone https://github.com/moritzbrantner/moenarch-foundation.git ../moenarch-foundation
        git -C ../moenarch-foundation checkout ead588f27d130d775524db31189b734a224843d5
        git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" clone https://github.com/moritzbrantner/visual-analysis.git ../visual-analysis
        git -C ../visual-analysis checkout d341c668f1baa14cd3d4e99c8ce8f5d39e43a974
        rustup toolchain install stable --profile minimal
        rustup default stable
      integration_command: bun run verify:postgres
      post_command: docker compose down -v

  link-validation:
    uses: moritzbrantner/reusable-workflows/.github/workflows/link-validation.yml@458c85c1a58cac26a5ab978e12ab8e9a27d4e0ee
    permissions:
      contents: read
      packages: read
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
    with:
      node_version: ""
      bun_version: "1.3.14"
      install_command: bun install --frozen-lockfile
      build_command: bun run build
      start_command: bun run preview -- --host 127.0.0.1 --port 4173
      link_check_url: http://127.0.0.1:4173
      upload_artifacts_on: failure
