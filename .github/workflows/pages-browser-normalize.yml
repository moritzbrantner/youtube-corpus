name: Pages Browser Normalize

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.head_ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Normalize analyzer and remove helper
        run: |
          bun run format
          git rm .github/workflows/pages-browser-normalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/features/analyzer/DirectBrowserYouTubeAnalyzer.tsx
          git commit -m "style: normalize direct browser analyzer"
          git push origin HEAD:${{ github.head_ref }}
