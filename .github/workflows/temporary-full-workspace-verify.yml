name: Temporary Full Workspace Verify

on:
  push:
    branches:
      - feat/multimodal-observations

permissions:
  contents: read

concurrency:
  group: temporary-full-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: youtube_corpus_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d youtube_corpus_verify"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: youtube-corpus
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/youtube_corpus_verify
    steps:
      - name: Check out youtube-corpus
        uses: actions/checkout@v4
        with:
          path: youtube-corpus

      - name: Check out nlp-stack
        uses: actions/checkout@v4
        with:
          repository: moritzbrantner/nlp-stack
          ref: 057689ca1df031d677f4afd9d65eed181c6fca06
          path: nlp-stack
          token: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}

      - name: Check out moenarch-foundation
        uses: actions/checkout@v4
        with:
          repository: moritzbrantner/moenarch-foundation
          ref: ead588f27d130d775524db31189b734a224843d5
          path: moenarch-foundation
          token: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}

      - name: Check out visual-analysis
        uses: actions/checkout@v4
        with:
          repository: moritzbrantner/visual-analysis
          ref: d341c668f1baa14cd3d4e99c8ce8f5d39e43a974
          path: visual-analysis
          token: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run full fast gate
        run: bun run verify:fast

      - name: Run Postgres integration gate
        run: bun run verify:postgres
