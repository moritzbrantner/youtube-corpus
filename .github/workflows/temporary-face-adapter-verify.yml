name: Temporary Face Adapter Verify

on:
  push:
    branches:
      - feat/multimodal-analysis-adapters

permissions:
  contents: write

concurrency:
  group: temporary-face-adapter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: youtube_corpus_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d youtube_corpus_verify"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: youtube-corpus
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/youtube_corpus_verify
    steps:
      - name: Check out youtube-corpus
        uses: actions/checkout@v4
        with:
          path: youtube-corpus

      - name: Check out nlp-stack
        uses: actions/checkout@v4
        with:
          repository: moritzbrantner/nlp-stack
          ref: 057689ca1df031d677f4afd9d65eed181c6fca06
          path: nlp-stack
          token: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}

      - name: Check out moenarch-foundation
        uses: actions/checkout@v4
        with:
          repository: moritzbrantner/moenarch-foundation
          ref: ead588f27d130d775524db31189b734a224843d5
          path: moenarch-foundation
          token: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}

      - name: Check out visual-analysis
        uses: actions/checkout@v4
        with:
          repository: moritzbrantner/visual-analysis
          ref: 223b4eca141ee0a23f10d8170ca8d16db1918a7c
          path: visual-analysis
          token: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install ONNX Runtime
        run: |
          python -m pip install --disable-pip-version-check "onnxruntime==1.26.0"
          python - <<'PY' >> "$GITHUB_ENV"
          import onnxruntime
          from pathlib import Path
          capi = Path(onnxruntime.__file__).resolve().parent / "capi"
          candidates = sorted(capi.glob("libonnxruntime.so*"))
          if not candidates:
              raise SystemExit(f"ONNX Runtime shared library not found under {capi}")
          print(f"ORT_DYLIB_PATH={candidates[0]}")
          PY

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Resolve and commit lockfile delta
        run: |
          cargo metadata --format-version 1 >/dev/null
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "Refresh lockfile for face analysis"
            git push origin HEAD:feat/multimodal-analysis-adapters
          fi

      - name: Verify locked source graph
        run: cargo check --locked

      - name: Verify source graph and face adapter
        run: bun run verify:fast

      - name: Verify Postgres integration
        run: bun run verify:postgres

      - name: Prepare public face fixture
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/opencv/opencv/4.x/samples/data/lena.jpg \
            --output /tmp/lena.jpg
          ffmpeg -hide_banner -loglevel error -y \
            -loop 1 -i /tmp/lena.jpg -t 3 -r 1 -pix_fmt yuv420p \
            /tmp/face-fixture.mp4
          test -s /tmp/face-fixture.mp4

      - name: Dogfood YuNet and SFace persistence
        env:
          FACE_VIDEO_FIXTURE: /tmp/face-fixture.mp4
        run: cargo test --test face_analysis_db -- --ignored --nocapture
