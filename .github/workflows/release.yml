name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        default: "0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve Release Inputs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
    steps:
      - name: Resolve inputs
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          if [[ -z "$version" ]]; then
            echo "Release version is required." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$version" >> "$GITHUB_OUTPUT"

  web-artifact:
    name: Build or reuse embedded web artifact
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/build-artifact.yml@5291d5162b128faca9dd83edba24e7342730e604
    with:
      source_sha: ${{ github.sha }}
      artifact_key: youtube-corpus-embedded-web-v1
      bun_version: "1.3.14"
      rust_toolchain: "1.98.1"
      rust_targets: wasm32-unknown-unknown
      cache_bun: true
      bun_cache_dependency_path: bun.lock
      cache_cargo: true
      cargo_cache_dependency_path: Cargo.lock
      use_environment_v1: false
      setup_command: |
        bun install --frozen-lockfile
        cargo install wasm-pack --version 0.14.0 --locked
      build_command: bun run build
      artifact_paths: dist
      reuse_across_runs: true
      artifact_retention_days: 7
      timeout_minutes: 30

  build:
    name: Build ${{ matrix.target }}
    needs:
      - prepare
      - web-artifact
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: youtube-corpus
        shell: bash
    steps:
      - name: Check out youtube-corpus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: youtube-corpus

      - name: Check out nlp-stack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: moritzbrantner/nlp-stack
          ref: 057689ca1df031d677f4afd9d65eed181c6fca06
          path: nlp-stack

      - name: Check out moenarch-foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: moritzbrantner/moenarch-foundation
          ref: b7533cd02269124deece75b76477ca55a853cd77
          path: moenarch-foundation

      - name: Check out visual-analysis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: moritzbrantner/visual-analysis
          ref: 8852f257de6ddc4580698ad00d4c9a9ab8461b70
          path: visual-analysis

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify native target
        run: |
          set -euo pipefail
          host="$(rustc -vV | awk '/^host:/ { print $2 }')"
          if [[ "$host" != "${{ matrix.target }}" ]]; then
            echo "Expected native host ${{ matrix.target }}, got $host." >&2
            exit 1
          fi

      - name: Consume verified embedded web artifact
        uses: moritzbrantner/reusable-workflows/.github/actions/consume-build-artifact@5291d5162b128faca9dd83edba24e7342730e604
        with:
          producer_run_id: ${{ needs.web-artifact.outputs.producer_run_id }}
          receipt_artifact_name: ${{ needs.web-artifact.outputs.receipt_artifact_name }}
          artifact_name: ${{ needs.web-artifact.outputs.artifact_name }}
          artifact_digest: ${{ needs.web-artifact.outputs.artifact_digest }}
          source_sha: ${{ needs.web-artifact.outputs.source_sha }}
          artifact_key: ${{ needs.web-artifact.outputs.artifact_key }}
          identity_digest: ${{ needs.web-artifact.outputs.identity_digest }}
          destination_path: youtube-corpus/dist
          github_token: ${{ github.token }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Check Rust
        run: cargo check --locked

      - name: Lint Rust
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test Rust
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke test binary
        run: |
          set -euo pipefail
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            binary="target/release/youtube-corpus.exe"
          else
            binary="target/release/youtube-corpus"
          fi

          "$binary" --version
          "$binary" --help
          "$binary" api-schema
          "$binary" diagnostics

      - name: Package release artifact
        id: package
        run: |
          set -euo pipefail
          scripts/package-release.sh "${{ needs.prepare.outputs.version }}" "${{ matrix.target }}"

          archive="target/release-artifacts/youtube-corpus-v${{ needs.prepare.outputs.version }}-${{ matrix.target }}"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            archive="${archive}.zip"
          else
            archive="${archive}.tar.gz"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: youtube-corpus-${{ matrix.target }}
          path: ${{ github.workspace }}/youtube-corpus/${{ steps.package.outputs.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifacts
          sha256sum youtube-corpus-v${{ needs.prepare.outputs.version }}-* > SHA256SUMS

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: youtube-corpus ${{ needs.prepare.outputs.tag_name }}
          files: release-artifacts/*
          body: |
            # youtube-corpus ${{ needs.prepare.outputs.tag_name }}

            Initial release of `youtube-corpus`, a local-first Rust CLI and browser UI for building a searchable YouTube transcript corpus in Postgres.

            ## Requirements

            - Postgres with pgvector
            - `yt-dlp`
            - `ffmpeg` and `ffprobe`
            - Optional: `whisper` CLI for ASR fallback

            ## Install

            Download the archive for your platform, unpack it, and place `youtube-corpus` on your PATH.

            ## Quick start

            ```bash
            docker compose up -d postgres
            youtube-corpus --database-url postgres://postgres:postgres@localhost:5432/youtube_corpus --migrate
            ```

            ## Notes

            The release binaries include the browser UI. Source builds use pinned sibling checkouts of `nlp-stack`, `moenarch-foundation`, and `visual-analysis`.
