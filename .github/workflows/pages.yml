name: Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate browser-only analyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out pinned nlp-stack source
        uses: actions/checkout@v4
        with:
          repository: moritzbrantner/nlp-stack
          ref: b0c5ea465aa045fd5a967004d0230310735adf7f
          path: _deps/nlp-stack

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check frontend formatting
        run: bun run format:check

      - name: Set up Rust for browser Wasm
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.14.0

      - name: Build browser NLP runtime
        run: NLP_STACK_DIR="$GITHUB_WORKSPACE/_deps/nlp-stack" bash scripts/build-browser-wasm.sh

      - name: Build analyzer
        run: bun run build

      - name: Check Pages artifact
        run: |
          test -s dist/index.html
          test -s dist/analysis-capabilities.json
          test -s dist/wasm/moenarch_text_analysis_wasm.js
          test -s dist/wasm/moenarch_text_analysis_wasm_bg.wasm
          grep -q 'youtube-corpus' dist/index.html
          grep -q '"requiredForPagesAnalysis": false' dist/analysis-capabilities.json

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
