name: Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate static analyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Set up Rust for browser Wasm
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Install wasm-pack
        run: if ! command -v wasm-pack; then cargo install wasm-pack --version 0.14.0 --locked; fi

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check frontend formatting
        run: bun run format:check

      - name: Check browser Wasm formatting
        run: cargo fmt --manifest-path crates/youtube-browser-wasm/Cargo.toml --check

      - name: Test browser extraction core
        run: bun run test:browser-wasm

      - name: Test standalone browser analysis
        run: bun run test:frontend

      - name: Verify standalone Pages capability contract
        run: |
          jq -e '.schemaVersion == 3 and .pagesStandalone == true and .backend.requiredForPages == false and .browser.captionAcquisition.directYoutube == true and .browser.captionAcquisition.thirdPartyProxy == false' public/analysis-capabilities.json >/dev/null

      - name: Build analyzer
        run: bun run build

      - name: Check Pages artifact
        run: |
          test -s dist/index.html
          test -s dist/analysis-capabilities.json
          grep -q 'youtube-corpus' dist/index.html
          jq -e '.pagesStandalone == true and .backend.requiredForPages == false and .browser.captionAcquisition.directYoutube == true' dist/analysis-capabilities.json >/dev/null
          find dist -type f -name '*.wasm' -size +0c | grep -q .

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
