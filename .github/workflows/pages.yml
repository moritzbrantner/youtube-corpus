name: Pages

on:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve-web-artifact:
    name: Reuse validated embedded web artifact
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/build-artifact.yml@5291d5162b128faca9dd83edba24e7342730e604
    with:
      source_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      artifact_key: youtube-corpus-embedded-web-v1
      bun_version: "1.3.14"
      rust_toolchain: "1.98.1"
      rust_targets: wasm32-unknown-unknown
      cache_bun: true
      bun_cache_dependency_path: bun.lock
      cache_cargo: true
      cargo_cache_dependency_path: Cargo.lock
      use_environment_v1: false
      setup_command: |
        bun install --frozen-lockfile
        cargo install wasm-pack --version 0.14.0 --locked
      build_command: bun run build
      artifact_paths: dist
      reuse_across_runs: true
      artifact_retention_days: 7
      timeout_minutes: 30

  deploy:
    name: Deploy GitHub Pages
    needs: resolve-web-artifact
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.resolve-web-artifact.outputs.source_sha }}

      - name: Consume verified embedded web artifact
        uses: moritzbrantner/reusable-workflows/.github/actions/consume-build-artifact@5291d5162b128faca9dd83edba24e7342730e604
        with:
          producer_run_id: ${{ needs.resolve-web-artifact.outputs.producer_run_id }}
          receipt_artifact_name: ${{ needs.resolve-web-artifact.outputs.receipt_artifact_name }}
          artifact_name: ${{ needs.resolve-web-artifact.outputs.artifact_name }}
          artifact_digest: ${{ needs.resolve-web-artifact.outputs.artifact_digest }}
          source_sha: ${{ needs.resolve-web-artifact.outputs.source_sha }}
          artifact_key: ${{ needs.resolve-web-artifact.outputs.artifact_key }}
          identity_digest: ${{ needs.resolve-web-artifact.outputs.identity_digest }}
          destination_path: dist
          github_token: ${{ github.token }}

      - name: Verify standalone Pages capability contract
        run: |
          jq -e '.schemaVersion == 3 and .pagesStandalone == true and .backend.requiredForPages == false and .browser.captionAcquisition.directYoutube == true and .browser.captionAcquisition.thirdPartyProxy == false' dist/analysis-capabilities.json >/dev/null
          test -s dist/index.html
          find dist -type f -name '*.wasm' -size +0c | grep -q .

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
