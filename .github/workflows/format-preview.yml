name: Format Preview

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Show formatter patch
        run: |
          bun run format
          git diff --unified=1 -- src/app/features/analyzer/BrowserYouTubeAnalyzer.tsx src/app/features/analyzer/browser-analysis.ts
