[package]
name = "youtube-corpus-desktop"
version = "0.1.0"
description = "Desktop app for searching a YouTube transcript corpus"
authors = ["Moenarch"]
edition = "2021"
publish = false

[lib]
name = "youtube_corpus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio-rustls",
  "postgres",
  "uuid",
] }
tauri = { version = "2", features = [] }
uuid = { version = "1.11", features = ["serde"] }
youtube-corpus = { path = ".." }
