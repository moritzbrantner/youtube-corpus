services:
  app:
    image: oven/bun:1
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && bun dev -- --host 0.0.0.0"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/youtube_corpus
    ports:
      - "1420:1420"
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - bun-cache:/root/.bun/install/cache
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: youtube_corpus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d youtube_corpus"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  bun-cache:
  node-modules:
  postgres-data:
